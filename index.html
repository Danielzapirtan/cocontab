<!doctype html>
<html lang="ro">
<head>
  <title>Buget cheltuieli</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="viewport">
    <div class="controls">
      <button id="minus" class="button nav" onclick="back()">-</button>
      <button id="plus" class="button nav" onclick="fwd()">+</button>
    <div class="flag">
    </div>
    </div>
    <div id="tab1" class="tab tab1">
      <div class="buget-container">
        <label for="buget-input">Buget: </label>
        <input type="number" id="buget-input" class="number-input" min="256" max=65536">
        <button id="save-buget" class="button submit" onclick="saveBuget()">Salveaza</button>
      </div>
      <div class="new-spent">
        <label for="produs">Produs</label>
        <input type="text" id="produs" class="text-input">
        <label for="pret">Pret:</label>
        <input type="number" id="pret" class="number-input" min="1" max="10000">
        <label for="categorie">Categorie</label>
        <select id="categorie">
          <option value="cumparaturi" selected>cumparaturi</option>
          <option value="casa">casa</option>
        </select>
        <button id="save-spent" class="button submit" onclick="saveSpent()">Salveaza</button>
      </div>
      <div class="misc">  
        <button id="clear-all" class="button submit" onclick="clearAll()">Sterge tot</button>
      </div>
    </div>
    <div id="tab2" class="tab tab2 disabled">
      <label for="lcasa">Casa</label>
      <div class="lista casa" id="lcasa">
      </div>
      <label for="lcumparaturi">Cumparaturi</label>
      <div class="lista cumparaturi" id="lcumparaturi">
      </div>
    </div>
    <div id="tab3" class="tab tab3 disabled">
      <label for="buget">Buget</label>
      <textarea class="money" id="buget" readonly>0</textarea>
      <label for="chelt">Cheltuieli</label>
      <textarea class="money" id="chelt" readonly>0</textarea>
      <label for="ramas">Ramas</label>
      <textarea class="money" id="ramas" readonly>0</textarea>
    </div>
  </div>
  <script src="script.js">
  </script>
</body>
</html>
